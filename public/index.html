<!doctype html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>MI CLOSET · Digital Wardrobe</title>

  <link
    rel="stylesheet"
    href="/styles.css"
  >

  <!-- Configuración de aplicación móvil -->
  <link
    rel="manifest"
    href="/manifest.json"
  >

  <meta
    name="theme-color"
    content="#111111"
  >

  <meta
    name="mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black"
  >

  <meta
    name="apple-mobile-web-app-title"
    content="Mi Closet"
  >

</head>


<body>

  <!-- =====================================================
       MENÚ LATERAL
  ====================================================== -->

  <aside class="sidebar">

    <div class="brand">
      MI CLOSET
      <span>DIGITAL WARDROBE</span>
    </div>

    <div class="menu-title">
      MENÚ PRINCIPAL
    </div>

    <nav>

      <button data-view="home">
        <svg class="menu-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3 10.5 12 3l9 7.5v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z" fill="currentColor"/>
        </svg>
        <span>Inicio</span>
      </button>

      <button data-view="ropa">
        <svg class="menu-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M9 5.5c0-1.7 1.3-3 3-3s3 1.3 3 3M8 5.5 4 9l-2 2.5 4 2 2-2v9h8v-9l2 2 4-2L20 9l-4-3.5M8 20.5h8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>Mi ropa</span>
      </button>

      <button data-view="ropa" data-filter="Zapatos">
        <svg class="menu-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3 14.5c2.2 0 3.8-.7 5.1-2.5l2-3 2.3 2.2c1.2 1.2 2.5 2 4.2 2.3l3.4.6c1.2.2 2 1.2 2 2.4v2H3z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M9.5 11.5 8 8l2.1-2.2 2.3 3.4M17 15h1.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        <span>Zapatos</span>
      </button>

      <button data-view="ropa" data-filter="Bolsos">
        <svg class="menu-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M5 8h14l1 13H4z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
          <path d="M8 8V6a4 4 0 0 1 8 0v2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        <span>Bolsos</span>
      </button>

      <button data-view="ropa" data-filter="Accesorios">
        <svg class="menu-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M2.5 10.5c2.2-2.4 5.6-2.5 9.5 0 3.9-2.5 7.3-2.4 9.5 0" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          <circle cx="7" cy="12" r="3.5" fill="none" stroke="currentColor" stroke-width="1.8"/>
          <circle cx="17" cy="12" r="3.5" fill="none" stroke="currentColor" stroke-width="1.8"/>
          <path d="M10.5 12h3" fill="none" stroke="currentColor" stroke-width="1.8"/>
        </svg>
        <span>Accesorios</span>
      </button>

      <button data-view="looks">
        <svg class="menu-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M9 4c0 2 1.2 3 3 3s3-1 3-3M9 4 6.5 7 9 9l-1 11h8l-1-11 2.5-2L15 4M9 9l3 2 3-2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>Mis looks</span>
      </button>

    </nav>

    <div class="menu-title">
      GESTIÓN
    </div>

    <nav>

      <button data-view="add">
        <svg class="menu-icon menu-icon-large" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 4v16M4 12h16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <span>Agregar artículo</span>
      </button>

      <button data-view="config">
        <svg class="menu-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 3.5 13.5 5l2.2-.2.9 2 2 .9-.2 2.2 1.5 1.5-1.5 1.5.2 2.2-2 .9-.9 2-2.2-.2-1.5 1.5-1.5-1.5-2.2.2-.9-2-2-.9.2-2.2L3.5 12 5 10.5l-.2-2.2 2-.9.9-2 2.2.2z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
          <circle cx="12" cy="12" r="2.8" fill="none" stroke="currentColor" stroke-width="1.8"/>
        </svg>
        <span>Configuración</span>
      </button>

      <button data-view="asesoria">
        <svg class="menu-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M8 15.5c-1.2-1.1-2-2.7-2-4.5a6 6 0 1 1 12 0c0 1.8-.8 3.4-2 4.5-.7.7-1 1.3-1 2H9c0-.7-.3-1.3-1-2z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
          <path d="M9 20h6M10 22h4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        <span>Asesoría de imagen</span>
      </button>

    </nav>

  </aside>


  <!-- =====================================================
       CONTENIDO PRINCIPAL
  ====================================================== -->

  <main class="main">

    <section
      id="home"
      class="view"
    ></section>


    <section
      id="ropa"
      class="view hidden"
    ></section>


    <section
      id="add"
      class="view hidden"
    ></section>


    <section
      id="looks"
      class="view hidden"
    ></section>

        <section
      id="asesoria"
      class="view hidden"
    ></section>

    <section
      id="config"
      class="view hidden"
    ></section>

  </main>


  <!-- =====================================================
       MENSAJES
  ====================================================== -->

  <div
    id="toast"
    class="toast"
  ></div>


  <!-- =====================================================
       JAVASCRIPT
  ====================================================== -->

  <script src="/app.js"></script>

</body>

</html>
